name: Test Full Beauty Article

on:
  workflow_dispatch:

jobs:
  build-article:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gemini SDK
        run: npm install @google/genai

      - name: Build complete article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/build-article.mjs

      - name: Search free beauty images
        run: node scripts/find-beauty-images.mjs

      - name: Show image results
        run: |
          echo "================================="
          echo "FREE BEAUTY IMAGES"
          echo "================================="

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const file = "generated/beauty-images.json";

          if (!fs.existsSync(file)) {
            throw new Error(`Missing ${file}`);
          }

          const data = JSON.parse(
            fs.readFileSync(file, "utf8")
          );

          console.log(`Topic: ${data.topic}`);
          console.log(`Images found: ${data.images.length}`);

          for (const [index, image] of data.images.entries()) {
            console.log("");
            console.log(`IMAGE ${index + 1}`);
            console.log(`Title: ${image.title}`);
            console.log(`URL: ${image.url}`);
            console.log(`Author: ${image.artist}`);
            console.log(`License: ${image.license}`);
            console.log(`License URL: ${image.licenseUrl}`);
            console.log(`File page: ${image.filePage}`);
          }

          if (data.images.length === 0) {
            throw new Error("No usable beauty images found");
          }

          console.log("");
          console.log("Image search successful.");
          NODE

      - name: Upload generated article and images
        uses: actions/upload-artifact@v4
        with:
          name: generated-beauty-article
          path: |
            generated/article.json
            generated/beauty-images.json
