name: Fix Articles & Verify Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install || npm install

      - name: Unpack JSON and fix articles
        run: node scripts/fix-articles-content.mjs

      - name: Test Astro Build
        run: npm run build

      - name: Commit and push fixed articles
        run: |
          git config --global user.name "BeautyTrend Bot"
          git config --global user.email "bot@beautytrend-daily.com"
          git add src/content/articles/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Fix: Unpack raw JSON into clean markdown and fix Boho image"
            git pull --rebase origin main
            git push origin main
            echo "Successfully pushed fixed articles!"
          fi