name: Patch & Upgrade All Existing Articles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-articles:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Patch & Regenerate All Existing Articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          node scripts/patch-existing-articles.mjs

      - name: Commit and Push patched articles
        run: |
          git config --global user.name "BeautyTrend Bot"
          git config --global user.email "bot@beautytrend-daily.com"
          git add src/content/articles/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "✨ Upgrade existing articles: 1200+ words, HD photos, in-context videos [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
