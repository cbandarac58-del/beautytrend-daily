name: Fix - Generate package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js with npm 9
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Downgrade npm to v9 and generate package-lock.json
        run: |
          npm install -g npm@9
          npm --version
          npm install --package-lock-only --legacy-peer-deps
          ls -la package-lock.json
          head -5 package-lock.json

      - name: Commit package-lock.json
        run: |
          git config user.name "BeautyTrend Bot"
          git config user.email "bot@beautytrend-daily.com"
          git add package-lock.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Fix: Add package-lock.json for Cloudflare Pages build"
            git pull --rebase origin main
            git push origin main
            echo "Pushed!"
          fi