name: Test Full Astro Article

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Gemini SDK
        run: npm install @google/genai

      - name: Generate article and YouTube data
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/build-article.mjs

      - name: Verify generated article JSON
        run: |
          if [ ! -f "generated/article.json" ]; then
            echo "ERROR: generated/article.json was not created."
            exit 1
          fi

          echo "generated/article.json exists."
          echo "File size:"
          wc -c generated/article.json

      - name: Create Astro article
        run: node scripts/create-astro-post.mjs

      - name: Verify Astro article
        run: |
          echo "================================="
          echo "GENERATED ASTRO FILES"
          echo "================================="

          find src/content/articles -maxdepth 1 -type f -print

          FILE=$(find src/content/articles -maxdepth 1 -type f | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: No Astro article was created."
            exit 1
          fi

          echo ""
          echo "================================="
          echo "ARTICLE FILE"
          echo "================================="
          echo "$FILE"

          echo ""
          echo "================================="
          echo "ARTICLE PREVIEW"
          echo "================================="

          sed -n '1,50p' "$FILE"

      - name: Upload generated article JSON
        uses: actions/upload-artifact@v4
        with:
          name: generated-article-json
          path: generated/article.json

      - name: Upload Astro article
        uses: actions/upload-artifact@v4
        with:
          name: astro-article-test
          path: src/content/articles/*.md
