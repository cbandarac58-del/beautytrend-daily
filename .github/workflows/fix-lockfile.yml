name: Fix - Generate package-lock.json

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Commit package-lock.json
        run: |
          git config user.name "BeautyTrend Bot"
          git config user.email "bot@beautytrend-daily.com"
          git add package-lock.json
          git commit -m "Fix: Add package-lock.json for Cloudflare Pages build"
          git push origin main
          echo "Done!"